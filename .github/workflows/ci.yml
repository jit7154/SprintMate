name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprintmate
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e backend/

      - name: Run Ruff Lint
        run: |
          ruff check backend

      - name: Run Unit Tests (Fast, No Database)
        run: |
          pytest backend/tests/unit

      - name: Run Database Migrations and Seed Loader
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/sprintmate
        run: |
          python backend/migrations/run_migrations.py
          python data/scripts/load_seed.py

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/sprintmate
          DATA_MODE: demo
        run: |
          pytest backend/tests/integration
